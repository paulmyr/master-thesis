[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ADoptEX"
version = "0.1.0"
description = "AdEx optimization library"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "jaxlib",
    "optax",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["ADoptEX*"]
